version: 2.1

commands:
  cibw_prepare_environment:
    description: "Prepare the environment for testing."
    steps:
      - run:
          name: Prepare the environment.
          command: bash .circleci/prepare.sh
  cibw_run_tests:
    description: "Runs tests, with CIBW_ENABLE=all on the main branch"
    steps:
      - run:
          name: Test
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              echo "INFO: Exporting CIBW_ENABLE=all for main branch test run."
              export CIBW_ENABLE=all
            else
              echo "INFO: CIBW_ENABLE not set for this branch test run."
            fi

            venv/bin/python ./bin/run_tests.py
          no_output_timeout: 30m

jobs:
  osx-python312:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    environment:
      PYTHON: python3
    steps:
      - checkout
      - cibw_prepare_environment
      - cibw_run_tests

  linux-python312:
    docker:
      - image: cimg/python:3.12
    environment:
      PYTHON: python3
      # Temporarily restrict the tests that are run on CircleCI to prevent
      # test timeouts.
      PYTEST_ADDOPTS: -k "unit_test or main_tests or test_0_basic or test_docker_images"
    steps:
      - checkout
      - setup_remote_docker
      - cibw_prepare_environment
      - cibw_run_tests

  linux-aarch64:
    machine:
       image: default
    resource_class: arm.medium
    environment:
      PYTHON: python3
      # Temporarily restrict the tests that are run on CircleCI to prevent
      # test timeouts.
      PYTEST_ADDOPTS: -k "unit_test or main_tests or test_0_basic or test_docker_images"
    steps:
      - checkout
      - cibw_prepare_environment
      - cibw_run_tests

  windows:
    machine:
      image: windows-default
    resource_class: windows.medium
    environment:
      # Temporarily restrict the tests that are run on CircleCI to prevent
      # test timeouts.
      PYTEST_ADDOPTS: -k "unit_test or main_tests or test_0_basic"
    steps:
      - checkout
      - run:
          name: Prepare the environment.
          command: |
            python --version
            python -m venv venv
            venv\Scripts\python -m pip install -U pip
            venv\Scripts\python -m pip install -e . --group test
            venv\Scripts\python -m pip freeze
            venv\Scripts\python --version
      - run:
          name: Test
          command: |
            if ($env:CIRCLE_BRANCH -eq "main") {
              Write-Host "INFO: Exporting CIBW_ENABLE=all for main branch test run."
              $env:CIBW_ENABLE = "all"
            } else {
              Write-Host "INFO: CIBW_ENABLE not set for this branch test run."
            }
            venv\Scripts\python ./bin/run_tests.py
          no_output_timeout: 30m

workflows:
  version: 2
  all-tests:
    jobs:
      - osx-python312
      - linux-python312
      - linux-aarch64
      - windows
